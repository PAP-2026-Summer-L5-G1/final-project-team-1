<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Rowdies:wght@300;400;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="wrap">
        <a href="index.html" class="brand">
          <img
            class="nav-logo"
            src="assets/fa-logo-outline-light.png"
            alt="Fresh Access logo"
          />
        </a>
        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          &#9776;
        </button>
        <nav class="main-nav" id="mainNav">
          <a href="index.html">Home</a>
          <a href="map.html">Map</a>
          <a href="profile.html">Profile</a>
        </nav>
      </div>
    </header>

    <main class="form-page">
      <div class="wrap">
        <section class="form-intro">
          <h1>Let's find your resource!</h1>
        </section>

        <form class="form-card" id="eligibilityForm">
          <label for="members">Number of household members</label>

          <select id="members" name="members" required>
            <option value="">Select household size</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>

          <label for="income">Monthly household income</label>
          <input
            id="income"
            name="income"
            type="number"
            inputmode="numeric"
            min="0"
            placeholder="e.g. 5000"
            required
          />

          <label for="zipcode">Zip code</label>
          <input
            id="zipcode"
            name="zipcode"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{5}"
            maxlength="5"
            placeholder="98101"
            required
          />

          <fieldset>
            <legend>
              Optional: Does your household include any children or pregnant
              people?
            </legend>

            <label>
              YES
              <input type="radio" name="special-group" value="yes" />
            </label>

            <label>
              NO
              <input type="radio" name="special-group" value="no" />
            </label>
          </fieldset>

          <button type="submit" class="form-button">
            Find nearby resources
          </button>
        </form>
      </div>
    </main>

    <script>
      const form = document.querySelector("#eligibilityForm");
      const savedData = sessionStorage.getItem("editFormData");

      if (savedData !== null) {
        const data = JSON.parse(savedData);

        document.querySelector("#members").value = data.members;
        document.querySelector("#income").value = data.income;
        document.querySelector("#zipcode").value = data.zipcode;

        const savedSpecialGroup = document.querySelector(
          'input[name="special-group"][value="' + data.specialGroup + '"]',
        );

        if (savedSpecialGroup) {
          savedSpecialGroup.checked = true;
        }

        sessionStorage.removeItem("editFormData");
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const formData = {
          members: document.querySelector("#members").value,
          income: document.querySelector("#income").value,
          zipcode: document.querySelector("#zipcode").value,

          specialGroup:
            document.querySelector('input[name="special-group"]:checked')
              ?.value || "no",
        };
        try {
          const response = await fetch("http://localhost:3000/api/matches", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(formData),
          });

          if (!response.ok) {
            throw new Error("Request failed");
          }

          const result = await response.json();

          const matchData = {
            formData,
            result,
          };

          sessionStorage.setItem("matchData", JSON.stringify(matchData));
          window.location.href = "match-result.html";
        } catch (error) {
          console.error("Submit error:", error);
          alert(error.message);
        }
      });
    </script>
  </body>
</html>
