<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fresh Access Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;600;700&family=Rowdies:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="form-page">
    <header class="navbar">
      <a class="logo" href="index.html"> #FreshAccess | Seattle </a>

      <nav aria-label="Main navigation">
        <a href="index.html">Resources</a>
        <a href="map.html">Map</a>
        <a href="profile.html">Profile</a>
      </nav>
    </header>

    <main>
      <h1>Let's find your resource!</h1>

      <form class="form-card" id="eligibilityForm">
        <label for="members">Number of household members</label>

        <select id="members" name="members" required>
          <option value="">Select household size</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5 or more</option>
        </select>

        <label for="income">Household income range</label>
        <input
          id="income"
          name="income"
          type="text"
          placeholder="$0 - $1,000"
          required
        />

        <label for="zipcode">Zip code</label>
        <input
          id="zipcode"
          name="zipcode"
          type="text"
          inputmode="numeric"
          pattern="[0-9]{5}"
          maxlength="5"
          placeholder="98101"
          required
        />

        <fieldset>
          <legend>Are you already using SNAP?</legend>

          <label>
            YES
            <input type="radio" name="snap" value="yes" required />
          </label>

          <label>
            NO
            <input type="radio" name="snap" value="no" />
          </label>
        </fieldset>

        <fieldset>
          <legend>
            Optional: Are there any children, elderly people, or pregnant women
            in your household?
          </legend>

          <label>
            YES
            <input type="radio" name="special-group" value="yes" />
          </label>

          <label>
            NO
            <input type="radio" name="special-group" value="no" />
          </label>
        </fieldset>

        <button type="submit" class="form-button">
  Submit the form
</button>
      </form>

      <div class="result-overlay" id="resultOverlay" hidden>
        <section
          class="result-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="resultTitle"
        >
          <h2 id="resultTitle">
            We found <strong>123</strong> resource that fit your status
          </h2>

          <div class="resource-tags">
            <span>Fresh Bucks</span>
            <span>SNAP</span>
            <span>Food markets</span>
            <span>Food banks</span>
            <span>Community meals</span>
          </div>

          <div class="result-actions">
            <label class="save-option">
              <span>Save as your default info</span>
              <input type="checkbox" id="saveDefault" />
            </label>

            <button type="button" id="goButton" class="form-button">
  Let’s go!
</button>
        </section>
      </div>
    </main>

    <script>
      const form = document.querySelector("#eligibilityForm");
      const resultOverlay = document.querySelector("#resultOverlay");
      const goButton = document.querySelector("#goButton");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const members = document.querySelector("#members").value;
        const income = document.querySelector("#income").value.trim();
        const zipcode = document.querySelector("#zipcode").value.trim();
        const snap = document.querySelector('input[name="snap"]:checked');

        if (!members || !income || !zipcode || !snap) {
          alert("Please complete the required fields.");
          return;
        }

        resultOverlay.hidden = false;
        document.body.style.overflow = "hidden";
      });

      goButton.addEventListener("click", function () {
        resultOverlay.hidden = true;
        document.body.style.overflow = "";
        window.location.href = "map.html";
      });
    </script>
  </body>
</html>
